name: Auto Convert Toffee Playlist to Worker Format

on:
  schedule:
    # প্রতি ৩০ মিনিট পর পর অটো-আপডেট হবে
    - cron: '*/30 * * * *'
  workflow_dispatch:   # বাইরে থেকে বা Cron-job.org থেকে ট্রিগার করার জন্য ইনপুটসহ
    inputs:
      trigger_source:
        description: 'Triggered by Cron or Manually'
        required: false
        default: 'cron-job'

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Converter
        run: python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --staged --quiet || (git commit -m "Auto Update Toffee Proxy Playlist [skip ci]" && git push)
